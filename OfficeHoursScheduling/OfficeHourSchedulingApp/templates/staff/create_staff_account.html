<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Staff Account</title>
</head>
<body>
  <h1>Create Staff Account</h1>

  {% if messages %}
    <div id="popup-alert" role="alert">
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}

  {% if form.errors %}
    <div class="form-errors" role="alert">
      {{ form.errors }}
    </div>
  {% endif %}

  <form method="post" action="{% url 'create_staff_account' %}">
    {% csrf_token %}
    <div>
      <label for="id_name">Name</label>
      {{ form.name }}
    </div>
    <div>
      <label for="id_email">Email</label>
      {{ form.email }}
    </div>
    <div>
      <label for="id_role">Role</label>
      {{ form.role }}
    </div>
    <button type="submit">Create Account</button>
  </form>
</body>
</html>
